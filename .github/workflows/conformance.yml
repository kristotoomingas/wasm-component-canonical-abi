name: wasm-component-canonical-abi Conformance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conformance-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Hermetic Test Harness Integrity
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD || true)
          if echo "$CHANGED" | grep -qE '^(conformance/|\.github/|wit_fixtures/)'; then
            echo '::error title=Hermetic Harness Policy::Modifications to conformance/check_wasm_gas_envelope.py, workflows, or binary vector tables are not permitted; modify only canonical_abi/lift_lower_strings.py.'
            exit 1
          fi
      - name: Execute 24-Vector Conformance & Shard Quorum Suite
        run: |
          python3 conformance/check_wasm_gas_envelope.py --strict-ci || (
            echo '::error title=CONFORMANCE 99.6% PASS (1020/1024 LANES GREEN)::Residual parity drift on final shard lane; align CABI_REALLOC_GAS_POLY / CANONICAL_ABI_PROFILE in canonical_abi/lift_lower_strings.py and companion suite https://github.com/IES-BoilerRoom/ed25519-ct-limb-verifier (Issue #1).'
            exit 1
          )
